name: Publicera Prince of Persia fran uppdelat spelarkiv

on:
  push:
    branches: [main]
    paths:
      - 'game-upload/prince-of-persia-github.zip.part03'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Publish Prince of Persia game from archive' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Kontrollera alla tre delar och packa upp spelet
        shell: bash
        run: |
          set -euo pipefail
          for n in 01 02 03; do
            test -s "game-upload/prince-of-persia-github.zip.part$n" || {
              echo "::error::Saknar del $n av spelarkivet"
              exit 1
            }
          done
          cat game-upload/prince-of-persia-github.zip.part{01,02,03} > "$RUNNER_TEMP/prince-of-persia.zip"
          echo "bfc96146d7c5602ebd44edc25d974e23cfb84c32d197c0891aa8736dfebbfb03  $RUNNER_TEMP/prince-of-persia.zip" | sha256sum -c -
          python3 - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path(__import__("os").environ["RUNNER_TEMP"]) / "prince-of-persia.zip"
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert len(names) == 254, f"Fel antal filer: {len(names)}"
              assert all(n.startswith("games/prince-of-persia/") and ".." not in pathlib.PurePosixPath(n).parts for n in names)
              assert "games/prince-of-persia/index.html" in names
              for member in z.infolist():
                  if (member.external_attr >> 16) & 0o170000 == 0o120000:
                      raise ValueError("Symbolisk lank inte tillaten")
              z.extractall(".")
          print("Spelet har packats upp i games/prince-of-persia/")
          PY

      - name: Publicera alla 254 filer till main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/prince-of-persia/
          git rm -f game-upload/prince-of-persia-github.zip.part{01,02,03}
          git commit -m "Publish Prince of Persia game from archive"
          git pull --rebase origin main
          git push origin HEAD:main
