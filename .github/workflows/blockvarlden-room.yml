name: Blockvärlden live room
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blockvarlden-room.yml'
      - 'tools/blockvarlden/live-room.cjs'
      - 'tools/blockvarlden/server/**'
      - 'games/blockvarlden/network/**'
      - 'wrangler.jsonc'
permissions:
  contents: read
jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install WebSocket test dependency
        run: npm install --prefix "$RUNNER_TEMP/room" ws@8.18.3
      - name: Wait for multiplayer protocol 3 deployment
        run: |
          for attempt in {1..60}; do
            if node -e "fetch('https://fritidsparken-github-io.th8kdfmyr7.workers.dev/health',{signal:AbortSignal.timeout(8000)}).then(r=>r.json()).then(v=>process.exit(v.service==='blockvarlden-room'&&v.protocol===3?0:1)).catch(()=>process.exit(1))"; then
              echo 'Multiplayer protocol 3 is deployed'
              exit 0
            fi
            echo "Waiting for Cloudflare deployment (attempt $attempt)"
            sleep 5
          done
          echo 'The expected multiplayer server was not deployed in time'
          exit 1
      - name: Test custom rooms and shared settings
        run: NODE_PATH="$RUNNER_TEMP/room/node_modules" node tools/blockvarlden/live-room.cjs
