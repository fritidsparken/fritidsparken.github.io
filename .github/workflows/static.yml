# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Release the timed-out Pages deployment
        if: github.event.before == '91e37ac80245148d125727d7f040641751cc12f5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/pages/deployments/90e3547155e89421c6c8d70fdbfb484eec4f8055"
          status=$(gh api "$endpoint" --jq .status)
          echo "Previous deployment status = $status"
          case "$status" in
            queued|pending|deployment_cancelled|updating_pages|syncing_files|deploying|deployment_in_progress)
              gh api --method POST "$endpoint/cancel"
              for attempt in {1..12}; do
                sleep 5
                status=$(gh api "$endpoint" --jq .status)
                echo "Previous deployment status = $status"
                case "$status" in deployment_cancelled|canceled|cancelled|succeed|failed|deployment_failed) break;; esac
              done
              ;;
          esac
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
