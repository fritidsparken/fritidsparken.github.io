<!doctype html><html lang="sv"><meta charset="utf-8"><title>Byggarbetsplatsen – grafikkontroll</title><style>body{margin:0;font:14px sans-serif;background:#edf5ee;color:#163e46}#world{position:absolute;inset:50px 0 0}#world canvas{width:100%;height:100%}header{position:relative;z-index:2;padding:8px;background:#fff9e9}button,select{padding:6px}#stats{margin-left:15px}</style><header><select id="project"><option>Villan</option><option>Lekplatsen</option><option>Bron</option><option>Skolan</option><option>Brandstationen</option><option>Stora bygget</option></select><select id="machine"><option>Grävmaskin</option><option>Dumper</option><option>Hjullastare</option><option>Mobilkran</option><option>Betongbil</option><option>Vält</option></select><button id="finished">Visa färdigt bygge</button><button id="work">Arbetsrörelse</button><span id="stats">Laddar modeller…</span></header><div id="world"></div><script src="../js/vendor/three.min.js"></script><script src="../js/flight-software-renderer.js"></script><script src="../games/byggarbetsplatsen/core.js"></script><script src="../games/byggarbetsplatsen/assets.js"></script><script src="../games/byggarbetsplatsen/world.js"></script><script>
(async()=>{const base=document.createElement('base');base.href='../games/byggarbetsplatsen/';document.head.appendChild(base);const started=performance.now();const probe=document.createElement('canvas');await BuildAssets.preload(!(probe.getContext('webgl2')||probe.getContext('webgl')));const elapsed=performance.now()-started;const host=document.getElementById('world'),w=BuildWorld.make(host,'high');let s=BuildCore.fresh(),m=0,done=false,last=performance.now(),frames=0,start=last;w.sync(s);document.getElementById('project').onchange=e=>{s=BuildCore.fresh(e.target.selectedIndex);done=false;w.sync(s)};document.getElementById('machine').onchange=e=>m=e.target.selectedIndex;document.getElementById('finished').onclick=()=>{s.counts=BuildCore.steps.map(x=>x[2]);s.dug=Array.from({length:12},(_,i)=>i);s.removed=12;s.rolled=s.roadDug=Array.from({length:6},(_,i)=>i);s.step=12;s.done=true;done=true;w.sync(s)};document.getElementById('work').onclick=()=>{w.animate(['dig','dump','fill','place','pour','roll'][m],{x:-6,z:-6});};function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;w.update(dt,now/1000,{},false,m,{x:-6,z:-6},done);frames++;if(now-start>1500){document.getElementById('stats').textContent=`${w.renderer.isSoftware?'CPU':'WebGL'} · ${Math.round(frames*1000/(now-start))} fps · laddning ${Math.round(elapsed)} ms · ${w.renderer.info?.render.calls||0} draw calls · ${w.renderer.info?.render.triangles||0} trianglar`;frames=0;start=now}requestAnimationFrame(frame)}requestAnimationFrame(frame);window.onresize=()=>w.resize()})().catch(e=>document.getElementById('stats').textContent=e.stack)
