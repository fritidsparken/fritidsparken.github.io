<!doctype html>
<html data-game-page lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#142326" />
    <title>Skatepark · Fritidsparken</title>
    <link rel="icon" href="../../assets/game-icons-2026/new-skatepark.webp" />
    <link rel="stylesheet" href="./style.css?v=evening-1" />
    <link rel="stylesheet" href="../ride-stick.css?v=1" />
  <style>#parks{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:640px){#parks{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
  <link rel="stylesheet" href="../shared/control-gestures.css"><script defer src="../shared/control-gestures.js"></script></head>
  <body>
    <canvas id="game" aria-label="Skatepark i 3D"></canvas>
    <main id="menu">
      <section class="shell">
        <header>
          <a href="../../">← Fritidsparken</a
          ><b>FP &nbsp; / &nbsp; SKATE CLUB</b>
        </header>
        <div id="hero">
          <div class="hero-copy">
            <small>FRI ÅKNING &nbsp; / &nbsp; VOL. 01</small>
            <h1>SKATEPARK<span>®</span></h1>
            <p>Din bräda. Din linje.</p>
          </div>
        </div>
        <div class="content">
          <div class="heading">
            <h2>Välj skatepark</h2>
            <small>01 — 03</small>
          </div>
          <div id="parks"></div>
          <div class="actions">
            <button class="primary" id="play">Spela &nbsp; ▶</button
            ><button id="together">Spela tillsammans</button><button data-panel="guide">Trickguide</button
            ><button data-panel="kit">Min utrustning</button
            ><button data-panel="settings">Inställningar</button>
          </div>
          <p id="error" role="alert"></p>
        </div>
      </section>
    </main>
    <div id="ride" hidden>
      <div class="stats">
        <div><small>POÄNG</small><strong id="total">0</strong></div>
        <div><small>REKORD</small><strong id="best">0</strong></div>
      </div>
      <button id="pause" aria-label="Pausa">Ⅱ</button>
      <output id="room-code" hidden style="position:absolute;top:4.5rem;left:1rem;color:white;background:#142326dc;padding:.3rem .6rem;border-radius:.4rem"></output><div id="message"></div>
      <div id="touch" hidden>
        <div class="ride-stick" role="group" aria-label="Styrspak. Dra uppåt för fart och nedåt för broms."><span></span></div>
        <div class="pad tricks">
          <button data-key="volt">Volt</button><button data-key="grab">Grab</button><button data-key="z">Z</button><button data-key="x">X</button
          ><button data-key="c">C</button><button id="jumpStick" class="ride-stick" aria-label="Svep i hoppriktningen för ett trick. Tryck för ollie."><span>Hopp</span><small aria-hidden="true">↑</small><small aria-hidden="true">→</small><small aria-hidden="true">↓</small><small aria-hidden="true">←</small><output id="jumpPreview"></output></button>
        </div>
      </div>
      <button id="reset" aria-label="Återställ åkaren">↺</button>
    </div>
    <dialog id="dialog">
      <div id="dialogBody"></div>
      <button id="back">Tillbaka</button>
    </dialog>
    <script src="../ride-stick.js?v=1"></script>
    <script src="../../js/vendor/three.min.js"></script>
    <script type="module" src="./game.js?v=alpstrand1"></script>
  </body>
</html>
