<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Origami – Fritidsparken</title><style>
:root{font-family:system-ui,sans-serif;color:#203a34;background:#f6f5ec}*{box-sizing:border-box}body{margin:0}header{background:#164d70;color:white;padding:13px max(16px,calc((100vw - 1000px)/2));display:flex;align-items:center;gap:18px}header a{color:white;text-decoration:none;font-weight:800}main{max-width:1050px;margin:auto;padding:20px}h1{font-size:clamp(30px,5vw,48px);margin:8px 0}p{line-height:1.5}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:22px 0}.tile{background:white;border:2px solid #d6e5dc;border-radius:18px;padding:17px;cursor:pointer;font:inherit;text-align:center;color:inherit}.tile[aria-pressed=true]{border-color:#287c6a;background:#e8f6ed}.tile .emoji{display:block;font-size:48px;margin-bottom:8px}.tile strong{display:block}.tile small{color:#58736b}.guide{background:white;border:1px solid #d7e4dc;border-radius:24px;padding:clamp(12px,3vw,30px)}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.level{background:#e4f2e9;border-radius:30px;padding:6px 12px;font-weight:700}.stage{display:grid;place-items:center;background:#eaf4f2;border-radius:20px;min-height:310px;margin:15px 0;overflow:hidden}.paper{width:min(100%,410px);height:310px}.paper polygon,.paper path{transition:all .7s ease;transform-box:fill-box;transform-origin:center}.paper .fold{stroke:#1b655c;stroke-width:2.5;stroke-dasharray:7 5;fill:none;opacity:.75}.paper .arrow{stroke:#d05c38;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}.instruction{font-size:clamp(17px,2.8vw,23px);font-weight:750;min-height:60px;text-align:center}.controls{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}button.control{border:0;background:#226f62;color:white;padding:14px 20px;border-radius:14px;font:700 16px system-ui;cursor:pointer;min-height:48px}button.control:disabled{opacity:.35;cursor:default}.count{font-weight:750;min-width:90px;text-align:center}.note{font-size:13px;color:#57716b;text-align:center;margin-top:18px}@media(max-width:600px){.stage{min-height:255px}.paper{height:250px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{padding:12px}header{padding:12px}}
@media(prefers-reduced-motion:reduce){.paper *{transition:none!important}}
</style></head><body><header><a href="/">← Fritidsparken</a><strong>✂️ Origami</strong></header><main><h1>Vik papper steg för steg</h1><p>Välj en modell. Titta på den animerade vikningen och tryck på <b>Jag är klar</b> när du har gjort samma sak med ditt papper.</p><div class="tiles" id="tiles"></div><section class="guide" aria-live="polite"><div class="topline"><h2 id="name"></h2><span class="level" id="level"></span></div><div class="stage"><svg id="paper" class="paper" viewBox="0 0 400 310" role="img" aria-label="Animerad vikguide"></svg></div><div class="instruction" id="instruction"></div><div class="controls"><button class="control" id="back">← Föregående</button><span class="count" id="count"></span><button class="control" id="next">Jag är klar →</button><button class="control" id="replay">↻ Visa igen</button></div><p class="note">Animerade översiktsbilder som visar vikningarnas riktning. Använd ett vanligt pappersark och följ instruktionen i varje steg.</p></section></main><script>
const models=[
{id:'plane',name:'Pappersflygplan',emoji:'✈️',level:'Lätt',steps:[['Lägg ett A4-papper på höjden.',[[115,35,285,35,285,275,115,275]],''],['Vik papperet på längden och öppna igen.',[[115,35,285,35,285,275,115,275]],'M200 35V275'],['Vik de två övre hörnen in mot mitten.',[[200,35,285,115,285,275,115,275,115,115]],'M200 35V275'],['Vik de sneda kanterna in mot mitten igen.',[[200,35,245,155,245,275,155,275,155,155]],'M200 35V275'],['Vik ihop längs mitten och vik ned vingarna.',[[200,35,275,240,200,200,125,240]],'M200 35V200'],['Klart! Justera vingarna så att planet flyger rakt.',[[200,45,330,240,200,192,70,240]],'']]},
{id:'box',name:'Pappersask',emoji:'📦',level:'Medel',steps:[['Börja med ett kvadratiskt papper.',[[90,35,310,35,310,255,90,255]],''],['Vik båda diagonalerna och öppna igen.',[[90,35,310,35,310,255,90,255]],'M90 35L310 255M310 35L90 255'],['Vik alla fyra hörn in till mitten.',[[200,35,310,145,200,255,90,145]],'M200 35V255M90 145H310'],['Vik över- och underkanten mot mitten.',[[130,80,270,80,270,210,130,210]],'M130 145H270'],['Öppna kortsidorna och vik upp väggarna.',[[130,110,160,70,240,70,270,110,270,210,240,250,160,250,130,210]],'M130 110L270 210'],['Forma hörnen så att asken står stadigt.',[[130,110,200,145,270,110,270,210,200,245,130,210]],'']]},
{id:'fortune',name:'Pappersloppa',emoji:'🦋',level:'Medel',steps:[['Använd ett kvadratiskt papper.',[[90,35,310,35,310,255,90,255]],''],['Vik på båda diagonalerna och öppna.',[[90,35,310,35,310,255,90,255]],'M90 35L310 255M310 35L90 255'],['Vik alla fyra hörn in mot mitten.',[[200,35,310,145,200,255,90,145]],'M200 35V255M90 145H310'],['Vänd papperet och vik hörnen mot mitten igen.',[[200,75,270,145,200,215,130,145]],'M200 75V215M130 145H270'],['Vik på mitten åt båda hållen.',[[130,75,270,75,270,215,130,215]],'M200 75V215M130 145H270'],['Stick in fingrarna i fickorna och öppna loppan.',[[200,40,255,115,330,145,255,175,200,250,145,175,70,145,145,115]],'M200 40V250M70 145H330']]},
{id:'star',name:'Pappersstjärna',emoji:'⭐',level:'Svår',steps:[['Börja med ett kvadratiskt papper.',[[90,35,310,35,310,255,90,255]],''],['Vik papperet på diagonalen.',[[200,35,310,255,90,255]],'M200 35L200 255'],['Vik triangeln på mitten och öppna igen.',[[200,45,290,235,110,235]],'M200 45V235'],['Vik in spetsarna mot mittlinjen.',[[200,30,260,145,230,260,170,260,140,145]],'M200 30V260'],['Forma fem spetsar genom att vika flikarna.',[[200,35,235,115,320,125,255,185,275,270,200,220,125,270,145,185,80,125,165,115]],''],['Stjärnformen är klar. Pressa alla veck.',[[200,25,244,110,340,125,270,195,288,280,200,235,112,280,130,195,60,125,156,110]],'']]}
];
let current=models[0],step=0;
const $=id=>document.getElementById(id);
function render(){const s=current.steps[step];$('name').textContent=current.emoji+' '+current.name;$('level').textContent=current.level;$('instruction').textContent=s[0];$('count').textContent=(step+1)+' / '+current.steps.length;$('back').disabled=step===0;$('next').textContent=step===current.steps.length-1?'Börja om ↻':'Jag är klar →';const coords=s[1][0];const pts=coords.reduce((a,v,i)=>a+(i%2?',':' ')+v,'').trim();$('paper').innerHTML='<defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#ffdc80"/><stop offset="1" stop-color="#f5a957"/></linearGradient></defs><polygon points="'+pts+'" fill="url(#g)" stroke="#a56e39" stroke-width="3" stroke-linejoin="round"/>'+(s[2]?'<path class="fold" d="'+s[2]+'"/>':'')+'<path class="arrow" d="M315 50q28 30 0 60m0 0-3-16m3 16 14-8" opacity=".75"/>';document.querySelectorAll('.tile').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===current.id)))}
models.forEach(m=>{const b=document.createElement('button');b.className='tile';b.dataset.id=m.id;b.innerHTML='<span class="emoji">'+m.emoji+'</span><strong>'+m.name+'</strong><small>'+m.level+' · '+m.steps.length+' steg</small>';b.onclick=()=>{current=m;step=0;render();document.querySelector('.guide').scrollIntoView({behavior:'smooth',block:'start'})};$('tiles').append(b)});
$('next').onclick=()=>{step=(step+1)%current.steps.length;render()};$('back').onclick=()=>{step=Math.max(0,step-1);render()};$('replay').onclick=()=>{const p=$('paper');p.animate([{opacity:.35,transform:'scale(.9)'},{opacity:1,transform:'scale(1)'}],{duration:650,easing:'ease-out'})};render();
</script></body></html>
